<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Bancário - Portal do Cliente</title>
    <!-- Importando o Bootstrap direto da nuvem (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            
            <!-- CARTÃO 1: Autenticação (Login ou Abertura de Conta) -->
            <div class="card shadow-sm mb-4" id="cartao-autenticacao">
                <div class="card-body">
                    <h3 class="mb-3 text-center">Banco Falso</h3>
                    
                    <!-- Abas de navegação -->
                    <ul class="nav nav-pills nav-fill mb-3" id="pills-tab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="tab-login" data-bs-toggle="pill" data-bs-target="#div-login" type="button">Entrar</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="tab-cadastro" data-bs-toggle="pill" data-bs-target="#div-cadastro" type="button">Abrir Conta</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="pills-tabContent">
                        
                        <!-- ABA 1: LOGIN -->
                        <div class="tab-pane fade show active" id="div-login" role="tabpanel">
                            <div class="mb-3">
                                <label for="inputLoginCpf" class="form-label">CPF ou Chave Única</label>
                                <input type="text" id="inputLoginCpf" class="form-control" placeholder="000.000.000-00 ou PIX-...">
                            </div>
                            <div class="mb-3">
                                <label for="inputLoginSenha" class="form-label">Senha</label>
                                <input type="password" id="inputLoginSenha" class="form-control" placeholder="Sua senha">
                            </div>
                            <button class="btn btn-success w-100" id="btnEntrar">Acessar Conta</button>
                        </div>

                        <!-- ABA 2: CADASTRO -->
                        <div class="tab-pane fade" id="div-cadastro" role="tabpanel">
                            <div class="mb-3">
                                <label for="inputNome" class="form-label">Nome Completo</label>
                                <input type="text" id="inputNome" class="form-control" placeholder="Digite seu nome">
                            </div>

                            <div class="mb-3">
                                <label for="inputCpf" class="form-label">CPF</label>
                                <input type="text" id="inputCpf" class="form-control" placeholder="Digite seu CPF">
                            </div>

                            <div class="mb-3">
                                <label for="inputSenha" class="form-label">Senha de Acesso</label>
                                <input type="password" id="inputSenha" class="form-control" placeholder="Crie uma senha">
                            </div>

                            <button class="btn btn-primary w-100" id="btnCriar">Abrir Conta</button>
                        </div>

                    </div>
                </div>
            </div>

            <!-- CARTÃO 2: Painel de Controle (Invisível no início) -->
            <div class="card shadow-sm d-none" id="cartao-painel">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h4 class="card-title mb-0">Olá, <span id="displayTitular" class="text-primary"></span></h4>
                        <button class="btn btn-outline-danger btn-sm" onclick="fazerLogoutCliente()">Sair</button>
                    </div>
                    
                    <p class="text-muted small mb-1">CPF: <span id="displayCpf"></span></p>
                    <p class="text-muted small mb-1">Sua Chave Única: <strong class="text-dark" id="displayChavePix"></strong></p>
                    <p class="text-muted small">Chassi: <span id="displayId"></span></p>
                    
                    <h2 class="display-4 text-success my-4">R$ <span id="displaySaldo">0,00</span></h2>

                    <div class="input-group mb-3">
                        <span class="input-group-text">R$</span>
                        <input type="number" id="inputValor" class="form-control" placeholder="0.00" step="0.01">
                    </div>
                    
                    <div class="d-flex gap-2 mb-3">
                        <button class="btn btn-success w-100" id="btnDepositar">Depositar</button>
                        <button class="btn btn-danger w-100" id="btnSacar">Sacar</button>
                    </div>

                    <!-- SEÇÃO DE TRANSFERÊNCIA VIA CHAVE ÚNICA -->
                    <hr class="my-4">
                    <h5 class="mb-3">Transferência (Chave Única)</h5>
                    <div class="mb-2">
                        <label for="inputChaveDestino" class="form-label small text-muted">Chave do Destinatário</label>
                        <input type="text" id="inputChaveDestino" class="form-control form-control-sm" placeholder="Ex: PIX-ABC12345">
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">R$</span>
                        <input type="number" id="inputValorTransferencia" class="form-control form-control-sm" placeholder="0.00" step="0.01">
                        <button class="btn btn-warning btn-sm fw-bold" id="btnTransferir">Enviar</button>
                    </div>

                    <!-- SEÇÃO DO EXTRATO BANCÁRIO -->
                    <hr>
                    <h5 class="mb-3">Extrato de Movimentações</h5>
                    <div class="table-responsive" style="max-height: 200px; overflow-y: auto;">
                        <table class="table table-sm table-striped align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Data / Hora</th>
                                    <th>Tipo</th>
                                    <th class="text-end">Valor</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaExtrato">
                                <tr>
                                    <td colspan="3" class="text-center text-muted">Nenhuma movimentação ainda.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Importando o JS do Bootstrap (necessário para as abas funcionarem) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Recupera o ID salvo na sessão do navegador (evita perder o acesso ao dar F5)
    let contaAtivaId = sessionStorage.getItem("contaAtivaId") || ""; 
    const URL_BASE = "http://localhost:5279/api/conta";

    // Ao carregar a página, se houver uma sessão ativa, puxa os dados automaticamente do SQLite
    window.addEventListener('DOMContentLoaded', async () => {
        if (contaAtivaId) {
            await carregarDadosContaAtiva();
        }
    });

    async function carregarDadosContaAtiva() {
        try {
            const resposta = await fetch(`${URL_BASE}/${contaAtivaId}`);
            if (!resposta.ok) {
                fazerLogoutCliente();
                return;
            }

            const conta = await resposta.json();
            
            // Popula os dados na tela
            document.getElementById('displayTitular').innerText = conta.titular;
            document.getElementById('displayCpf').innerText = conta.cpf;
            document.getElementById('displayChavePix').innerText = conta.chavePix;
            document.getElementById('displayId').innerText = conta.id;
            document.getElementById('displaySaldo').innerText = conta.saldo.toFixed(2);
            
            // Alterna os cartões
            document.getElementById('cartao-autenticacao').classList.add('d-none');
            document.getElementById('cartao-painel').classList.remove('d-none');

            carregarExtrato();
        } catch (erro) {
            console.error("Erro ao recuperar sessão da conta:", erro);
        }
    }

    function fazerLogoutCliente() {
        sessionStorage.removeItem("contaAtivaId");
        contaAtivaId = "";
        document.getElementById('cartao-autenticacao').classList.remove('d-none');
        document.getElementById('cartao-painel').classList.add('d-none');
    }

    // 1. CARREGAR EXTRATO
    async function carregarExtrato() {
        if (!contaAtivaId) return;

        try {
            const resposta = await fetch(`${URL_BASE}/${contaAtivaId}/extrato`);
            if (!resposta.ok) return;

            const transacoes = await resposta.json();
            const tbody = document.getElementById('tabelaExtrato');

            if (transacoes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">Nenhuma movimentação ainda.</td></tr>`;
                return;
            }

            let htmlExtrato = "";
            transacoes.forEach(t => {
                const dataFormatada = new Date(t.dataHora).toLocaleString('pt-BR');
                const corValor = t.tipo === 1 ? "text-success" : "text-danger"; 
                const nomeTipo = t.tipo === 1 ? "Depósito" : (t.tipo === 2 ? "Saque" : "Transferência");
                const sinal = t.tipo === 1 ? "+" : "-";

                htmlExtrato += `
                    <tr>
                        <td class="small text-muted">${dataFormatada}</td>
                        <td><span class="badge bg-${t.tipo === 1 ? 'success' : 'danger'}">${nomeTipo}</span></td>
                        <td class="text-end font-monospace ${corValor}">${sinal} R$ ${t.valor.toFixed(2)}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = htmlExtrato;
        } catch (erro) {
            console.error("Erro ao carregar extrato:", erro);
        }
    }

    // 2. CRIAR CONTA
    document.getElementById('btnCriar').addEventListener('click', async () => {
        const titular = document.getElementById('inputNome').value.trim();
        const cpf = document.getElementById('inputCpf').value.trim();
        const senha = document.getElementById('inputSenha').value.trim();

        if (!titular || !cpf || !senha) {
            return alert("Por favor, preencha o nome, o CPF e a senha!");
        }

        try {
            const resposta = await fetch(URL_BASE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ titular: titular, cpf: cpf, senha: senha })
            });

            if (!resposta.ok) {
                const erroMsg = await resposta.text();
                return alert("Erro ao criar conta: " + erroMsg);
            }

            const conta = await resposta.json();
            
            contaAtivaId = conta.id;
            sessionStorage.setItem("contaAtivaId", contaAtivaId);
            
            await carregarDadosContaAtiva();

        } catch (erro) {
            console.error("Erro na comunicação com o servidor:", erro);
        }
    });

    // 3. LOGIN DO CLIENTE
    document.getElementById('btnEntrar').addEventListener('click', async () => {
        const cpfOuChave = document.getElementById('inputLoginCpf').value.trim();
        const senha = document.getElementById('inputLoginSenha').value.trim();

        if (!cpfOuChave || !senha) {
            return alert("Por favor, preencha o CPF ou Chave e a senha!");
        }

        try {
            const resposta = await fetch(`${URL_BASE}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cpfOuChave: cpfOuChave, senha: senha })
            });

            if (!resposta.ok) {
                const erroMsg = await resposta.text();
                return alert("Falha no login: " + erroMsg);
            }

            const conta = await resposta.json();
            
            contaAtivaId = conta.id;
            sessionStorage.setItem("contaAtivaId", contaAtivaId);
            
            await carregarDadosContaAtiva();

        } catch (erro) {
            console.error("Erro ao realizar login:", erro);
        }
    });

    // 4. PROCESSAR TRANSAÇÕES (DEPOSITAR / SACAR)
    async function processarTransacao(tipo) {
        const valor = parseFloat(document.getElementById('inputValor').value);
        if (!valor || valor <= 0) return alert("Digite um valor válido!");

        try {
            const resposta = await fetch(`${URL_BASE}/${contaAtivaId}/${tipo}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(valor)
            });

            if (!resposta.ok) {
                const mensagemErro = await resposta.text();
                return alert("Operação negada: " + mensagemErro);
            }

            const resultado = await resposta.json();
            
            document.getElementById('displaySaldo').innerText = resultado.saldoAtual.toFixed(2);
            document.getElementById('inputValor').value = "";

            carregarExtrato();

        } catch (erro) {
            console.error(`Erro na transação de ${tipo}:`, erro);
        }
    }

    // 5. TRANSFERIR VIA CHAVE ÚNICA
    document.getElementById('btnTransferir').addEventListener('click', async () => {
        const chaveDestino = document.getElementById('inputChaveDestino').value.trim();
        const valor = parseFloat(document.getElementById('inputValorTransferencia').value);

        if (!chaveDestino || !valor || valor <= 0) {
            return alert("Preencha a chave de destino e um valor válido!");
        }

        try {
            const resposta = await fetch(`${URL_BASE}/${contaAtivaId}/transferir`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chaveDestino: chaveDestino, valor: valor })
            });

            if (!resposta.ok) {
                const erroMsg = await resposta.text();
                return alert("Falha na transferência: " + erroMsg);
            }

            const resultado = await resposta.json();
            
            document.getElementById('displaySaldo').innerText = resultado.novoSaldoOrigem.toFixed(2);
            document.getElementById('inputChaveDestino').value = "";
            document.getElementById('inputValorTransferencia').value = "";

            alert("Transferência efetuada com sucesso!");
            carregarExtrato();

        } catch (erro) {
            console.error("Erro na transferência:", erro);
        }
    });

    document.getElementById('btnDepositar').addEventListener('click', () => processarTransacao("depositar"));
    document.getElementById('btnSacar').addEventListener('click', () => processarTransacao("sacar"));
</script>
</body>
</html>
