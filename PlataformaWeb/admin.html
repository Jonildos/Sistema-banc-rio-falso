<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Banco Falso</title>
    <!-- Importando o Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-11">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Painel do Administrador</h2>
                <span class="badge bg-success">Sistema Online &bull; Auditoria Ativa</span>
            </div>

            <!-- GRID COM DUAS COLUNAS: Pesquisa & Detalhes / Listagem Geral -->
            <div class="row">
                
                <!-- COLUNA DA ESQUERDA: Pesquisas e Detalhes da Conta Selecionada -->
                <div class="col-md-5">
                    <div class="card bg-secondary text-white shadow-sm mb-4">
                        <div class="card-body">
                            <h5 class="card-title mb-3">Pesquisa Direta</h5>
                            
                            <!-- Busca por CPF -->
                            <div class="mb-3">
                                <label class="form-label small">Buscar por CPF Exato</label>
                                <div class="input-group">
                                    <input type="text" id="inputCpfBusca" class="form-control" placeholder="000.000.000-00">
                                    <button class="btn btn-warning" id="btnBuscarCpf">Buscar</button>
                                </div>
                            </div>

                            <!-- Busca por Nome -->
                            <div class="mb-3">
                                <label class="form-label small">Buscar por Nome</label>
                                <div class="input-group">
                                    <input type="text" id="inputNomeBusca" class="form-control" placeholder="Nome do titular">
                                    <button class="btn btn-info text-white" id="btnBuscarNome">Buscar</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- CAIXA DE RESULTADO E EXTRATO DA CONTA SELECIONADA -->
                    <div class="card bg-secondary text-white shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title mb-3">Auditoria da Conta</h5>
                            <div id="resultadoArea" class="p-3 bg-dark rounded border border-secondary" style="min-height: 250px;">
                                <p class="text-muted mb-0 small">Nenhuma conta selecionada. Utilize os filtros acima ou clique em uma conta da lista ao lado.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- COLUNA DA DIREITA: Listagem Geral em Tempo Real -->
                <div class="col-md-7">
                    <div class="card bg-secondary text-white shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="card-title mb-0">Todas as Contas no Sistema</h5>
                                <button class="btn btn-sm btn-outline-light" onclick="carregarTodasAsContas()">Atualizar Agora</button>
                            </div>
                            
                            <div class="table-responsive bg-dark rounded p-2" style="max-height: 480px; overflow-y: auto;">
                                <table class="table table-dark table-striped table-hover mb-0 align-middle">
                                    <thead>
                                        <tr>
                                            <th>Titular / CPF</th>
                                            <th>Saldo</th>
                                            <th class="text-end">Ação</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabelaUsuarios">
                                        <tr>
                                            <td colspan="3" class="text-center text-muted">Carregando usuários...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>

<script>
    const URL_BASE = "http://localhost:5279/api/conta";

    // FUNÇÃO REUTILIZÁVEL: Exibir os detalhes e o extrato de uma conta específica no painel admin
    async function exibirDetalhesConta(conta) {
        try {
            // Puxa o extrato atualizado desta conta na API
            const respostaExtrato = await fetch(`${URL_BASE}/${conta.id}/extrato`);
            const transacoes = respostaExtrato.ok ? await respostaExtrato.json() : [];

            let htmlTransacoes = "";
            if (transacoes.length === 0) {
                htmlTransacoes = `<tr><td colspan="3" class="text-center text-muted small">Nenhuma movimentação registrada.</td></tr>`;
            } else {
                transacoes.forEach(t => {
                    const dataFormatada = new Date(t.dataHora).toLocaleString('pt-BR');
                    const corValor = t.tipo === "Depósito" ? "text-success" : "text-danger";
                    const sinal = t.tipo === "Depósito" ? "+" : "-";
                    htmlTransacoes += `
                        <tr>
                            <td class="text-muted" style="font-size: 11px;">${dataFormatada}</td>
                            <td><span class="badge bg-${t.tipo === 'Depósito' ? 'success' : 'danger'}" style="font-size: 10px;">${t.tipo}</span></td>
                            <td class="text-end font-monospace ${corValor}" style="font-size: 12px;">${sinal} R$ ${t.valor.toFixed(2)}</td>
                        </tr>
                    `;
                });
            }

            // Monta o card de auditoria com os dados da conta e a tabela de extrato
            document.getElementById('resultadoArea').innerHTML = `
                <div class="mb-3">
                    <h6 class="text-success mb-1">${conta.titular}</h6>
                    <p class="mb-1 small text-light"><strong>CPF:</strong> ${conta.cpf}</p>
                    <p class="mb-1 small text-muted"><strong>ID:</strong> ${conta.id}</p>
                    <p class="mb-2 small"><strong>Saldo Atual:</strong> <span class="text-success fs-6 fw-bold">R$ ${conta.saldo.toFixed(2)}</span></p>
                </div>
                <hr class="border-secondary my-2">
                <h6 class="small text-warning mb-2">Extrato de Movimentações:</h6>
                <div class="table-responsive" style="max-height: 150px; overflow-y: auto;">
                    <table class="table table-dark table-sm mb-0 align-middle">
                        <tbody>
                            ${htmlTransacoes}
                        </tbody>
                    </table>
                </div>
            `;
        } catch (erro) {
            console.error("Erro ao carregar detalhes da conta:", erro);
        }
    }

    // FUNÇÃO: Carregar todas as contas na tabela da direita
    async function carregarTodasAsContas() {
        try {
            const resposta = await fetch(URL_BASE);
            if (!resposta.ok) return;

            const contas = await resposta.json();
            const tbody = document.getElementById('tabelaUsuarios');

            if (contas.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">Nenhuma conta cadastrada ainda.</td></tr>`;
                return;
            }

            let htmlTabela = "";
            contas.forEach(c => {
                htmlTabela += `
                    <tr>
                        <td>
                            <strong>${c.titular}</strong><br>
                            <small class="text-muted">${c.cpf}</small>
                        </td>
                        <td class="text-success font-monospace">R$ ${c.saldo.toFixed(2)}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-warning" onclick='exibirDetalhesConta(${JSON.stringify(c)})'>Auditar</button>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = htmlTabela;
        } catch (erro) {
            console.error("Erro ao sincronizar contas:", erro);
        }
    }

    // 1. BUSCAR POR CPF
    document.getElementById('btnBuscarCpf').addEventListener('click', async () => {
        const cpf = document.getElementById('inputCpfBusca').value.trim();
        if (!cpf) return alert("Digite um CPF para buscar!");

        try {
            const resposta = await fetch(`${URL_BASE}/buscar-por-cpf/${cpf}`);
            if (!resposta.ok) {
                const erroMsg = await resposta.text();
                document.getElementById('resultadoArea').innerHTML = `<p class="text-danger small">${erroMsg}</p>`;
                return;
            }

            const conta = await resposta.json();
            exibirDetalhesConta(conta);
        } catch (erro) {
            console.error("Erro na busca:", erro);
        }
    });

    // 2. BUSCAR POR NOME
    document.getElementById('btnBuscarNome').addEventListener('click', async () => {
        const nome = document.getElementById('inputNomeBusca').value.trim();
        if (!nome) return alert("Digite um nome para buscar!");

        try {
            const resposta = await fetch(`${URL_BASE}/buscar-por-nome/${nome}`);
            if (!resposta.ok) {
                const erroMsg = await resposta.text();
                document.getElementById('resultadoArea').innerHTML = `<p class="text-danger small">${erroMsg}</p>`;
                return;
            }

            const contas = await resposta.json();
            if (contas.length === 1) {
                exibirDetalhesConta(contas[0]);
                return;
            }

            let htmlResultados = `<small class="text-info">Encontradas ${contas.length} contas. Clique em "Auditar" na tabela ao lado ou selecione:</small><hr class="my-1">`;
            contas.forEach(c => {
                htmlResultados += `
                    <div class="d-flex justify-content-between align-items-center mb-1 pb-1 border-bottom border-secondary small">
                        <span><strong>${c.titular}</strong> (${c.cpf})</span>
                        <button class="btn btn-xs btn-outline-info py-0 px-2" style="font-size: 11px;" onclick='exibirDetalhesConta(${JSON.stringify(c)})'>Ver</button>
                    </div>
                `;
            });

            document.getElementById('resultadoArea').innerHTML = htmlResultados;
        } catch (erro) {
            console.error("Erro na busca:", erro);
        }
    });

    // Inicializa a listagem geral e ativa o tempo real (a cada 3 segundos)
    carregarTodasAsContas();
    setInterval(carregarTodasAsContas, 3000);
</script>
</body>
</html>
