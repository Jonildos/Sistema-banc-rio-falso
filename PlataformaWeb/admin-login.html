<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo - Banco Falso</title>
    <!-- Importando o Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            
            <div class="card bg-secondary text-white shadow">
                <div class="card-body p-4">
                    <h3 class="mb-3 text-center">Acesso Restrito</h3>
                    <p class="text-muted small text-center mb-4">Painel de Auditoria e Controle</p>
                    
                    <div class="mb-3">
                        <label for="inputEmail" class="form-label">E-mail Administrativo</label>
                        <input type="email" id="inputEmail" class="form-control" placeholder="admin@bancofalso.com">
                    </div>

                    <div class="mb-3">
                        <label for="inputCpf" class="form-label">CPF</label>
                        <input type="text" id="inputCpf" class="form-control" placeholder="000.000.000-00">
                    </div>

                    <div class="mb-4">
                        <label for="inputSenha" class="form-label">Senha de Acesso</label>
                        <input type="password" id="inputSenha" class="form-control" placeholder="********">
                    </div>

                    <button class="btn btn-warning w-100 fw-bold" id="btnLoginAdmin">Entrar no Sistema</button>
                    
                    <div class="text-center mt-3">
                        <a href="index.html" class="text-decoration-none text-muted small">&larr; Voltar ao Portal do Cliente</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    const URL_BASE = "http://localhost:5279/api/conta/admin/login";

    document.getElementById('btnLoginAdmin').addEventListener('click', async () => {
        const email = document.getElementById('inputEmail').value.trim();
        const cpf = document.getElementById('inputCpf').value.trim();
        const senha = document.getElementById('inputSenha').value.trim();

        if (!email || !cpf || !senha) {
            return alert("Por favor, preencha todos os campos de credencial!");
        }

        try {
            const resposta = await fetch(URL_BASE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, cpf: cpf, senha: senha })
            });

            if (!resposta.ok) {
                const erroMsg = await resposta.text();
                return alert("Acesso Negado: " + erroMsg);
            }

            // Segurança extra em sessionStorage: Marca que este navegador está autenticado como admin
            sessionStorage.setItem("admin_autenticado", "true");

            // Redireciona para o painel administrativo de fato
            window.location.href = "admin.html";

        } catch (erro) {
            console.error("Erro na tentativa de login:", erro);
            alert("Erro de comunicação com o servidor.");
        }
    });
</script>
</body>
</html>
